<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Aplikasi</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f4f7;
        }

        .login-box {
            width: 90%;
            max-width: 380px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #007aff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #007aff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #pesan {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Selamat Datang</h1>
        <p class="subtitle">Silakan login ke aplikasi</p>

        <form onsubmit="login(event)">

            <label>Username</label>
            <input 
                type="text" 
                id="username" 
                placeholder="Masukkan username"
                required
            >

            <label>Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Masukkan password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="pesan"></p>

    </div>

    <script>
        function login(event) {

            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const pesan = document.getElementById("pesan");

            // Username dan password contoh
            if (username === "radho" && password === "12345") {

                pesan.style.color = "green";
                pesan.textContent = "Login berhasil!";

                // Bisa diarahkan ke halaman lain
                // window.location.href = "dashboard.html";

            } else {

                pesan.style.color = "red";
                pesan.textContent = "Username atau password salah.";

            }
        }
    </script>

</body>
</html>
